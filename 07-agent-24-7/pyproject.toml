[project]
name = "razbor07"
version = "0.1.0"
description = "Разбор 07: агент 24/7 — очередь, ретраи, идемпотентность, трассы; прогон сбоев без живого LLM"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
razbor07 = "razbor07.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/razbor07"]

[tool.pytest.ini_options]
testpaths = ["tests"]
