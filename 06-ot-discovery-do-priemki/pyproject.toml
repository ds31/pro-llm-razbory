[project]
name = "razbor06"
version = "0.1.0"
description = "Разбор 06: путь FDE от discovery до приёмки — проверка discovery, каркас кейсов приёмки и ворота по eval"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.5,<2", "pyyaml>=6", "razbor01"]

[tool.uv.sources]
razbor01 = { path = "../01-agent-vret-v-cifrah", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
razbor06 = "razbor06.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/razbor06"]

[tool.pytest.ini_options]
testpaths = ["tests"]
