# Discovery — шаблон. Скопируйте, заполните по интервью (templates/interview.md) и проверьте:
#   uv run razbor06 check путь/к/discovery.yaml [--no-catalog]
# Заполненный пример — examples/retail/discovery.yaml.
project: "<что строим одной строкой>"
as_of: "<ГГГГ-ММ-ДД — дата выгрузки данных, на которой шли интервью>"

stakeholders:                      # роли, не имена; каждая роль ниже должна быть в этом списке
  - role: "<кто задаёт вопросы>"
    note: "<какие вопросы, когда>"
  - role: "<владелец чисел>"
    note: "<какие числа подписывает>"
  - role: "<владелец выгрузок>"
    note: "<какие системы>"

data_map:                          # каждая таблица, из которой считается хоть одно число
  - source: "<схема.таблица>"
    what: "<что в строке: зерно, поля, как выглядит возврат/отмена>"
    system: "<откуда приходит и как: выгрузка, API, файл>"
    owner: "<роль из stakeholders>"
    refresh: "<как часто и за какой период>"
    issues:                        # всё, что нашли при профилировании; проблема станет кейсом приёмки, если источник читает вопрос руководства
      - id: "<короткий id: anomaly, open_month, dup_cards…>"
        what: "<что не так, сколько строк, где именно — с примером>"
        only_if: "<необязательно: relative_period — проблема бьёт только по вопросам «за прошлый месяц»>"

questions:                         # вопросы руководства дословно; один вопрос — одно решение
  - id: M1
    asked_by: "<роль>"
    question: "<дословно, как спрашивает руководитель>"
    decision: "<какое решение принимают по этому числу>"
    cadence: "<как часто и какими словами спрашивают: «каждый месяц 10-го, за прошлый месяц»>"
    relative_period: "<true, если период задают словами «прошлый», «последний»>"
    metric: "<id метрики слоя; отношение — «a / b»>"
    scale: "<необязательно: 100 для процентов>"
    definition: "<определение словами владельца: что входит, что нет>"
    alternatives: ["<метрики, которые легко перепутать с этой>"]
    dimensions: ["<разрез, если «по магазинам», «по категориям»>"]
    row_question: "<если есть dimensions: вопрос по одной строке, с {key}>"
    period: {from: <ГГГГ-ММ-ДД>, to: <ГГГГ-ММ-ДД>}
    sources: ["<таблицы из data_map>"]
    owner: "<роль, которая подписывает число>"
    tolerance_pct: 0.5
    golden:
      how: "<откуда эталон: отчёт учётной системы за закрытый период, сверка построчно>"
      signed_by: "<та же роль, что owner>"
      signed_on: "<ГГГГ-ММ-ДД>"
      question: "<необязательно: формулировка для eval, если вопрос руководителя не годится дословно>"
      sql: "<запрос по сырым таблицам с правилами компании, который даёт подписанное число>"
      covers: ["<необязательно: issue:… и alt:…, которые проверяет сам базовый кейс>"]
    checks:                        # кейсы-пробы: по одному на каждую проблему источников и каждую альтернативу
      - covers: ["issue:<id>"]
        question: "<вопрос, на котором эта проблема ломает наивный запрос>"
        metric_query: {metric: <id>, date_from: <ГГГГ-ММ-ДД>, date_to: <ГГГГ-ММ-ДД>, filters: {<измерение>: [<значение>]}}
        golden_sql: "<эталонный запрос>"
