# Спека прототипа — машинная часть: что считаем «работает». Текст спеки на страницу — templates/prototype-spec.md.
# Пороги согласованы с владельцами чисел до начала работ и после не меняются.
name: Агент-аналитик для руководства
discovery: discovery.yaml
variants:
  A: {title: агент пишет SQL по сырым таблицам, layer: false}
  B: {title: агент работает через витрины и слой метрик пакета 01, layer: true}
works_when:
  tolerance_pct: 0.5          # допуск по каждому числу, как в пакете 01
  every_case_answered: true   # у каждого кейса приёмки есть ответ агента
  max_cost_usd: 0.05          # средняя цена ответа
  max_seconds: 15             # среднее время ответа
out_of_scope:
  - прогнозы и планы
  - вопросы про незакрытый месяц — агент отвечает последним закрытым
