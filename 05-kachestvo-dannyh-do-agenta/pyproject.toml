[project]
name = "razbor05"
version = "0.1.0"
description = "Разбор 05: качество данных до агента — правила на загрузке, карантин и закрытие месяца"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.5,<2", "pyyaml>=6", "razbor01"]

[tool.uv.sources]
razbor01 = { path = "../01-agent-vret-v-cifrah", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
razbor05 = "razbor05.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/razbor05"]

[tool.pytest.ini_options]
testpaths = ["tests"]
