[project]
name = "razbor08"
version = "0.1.0"
description = "Разбор 08: компания на 1С без команды данных — выгрузка, хранилище, Metabase и агент"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.5,<2", "pyyaml>=6", "razbor01"]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.2"]

[tool.uv.sources]
razbor01 = { path = "../01-agent-vret-v-cifrah", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
razbor08 = "razbor08.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/razbor08"]

[tool.pytest.ini_options]
testpaths = ["tests"]
