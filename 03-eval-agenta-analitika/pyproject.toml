[project]
name = "razbor03"
version = "0.1.0"
description = "Разбор 03: как доказать, что AI-агент считает правильно — каркас eval с живыми эталонами"
requires-python = ">=3.10"
dependencies = ["razbor01", "duckdb>=1.5,<2", "pyyaml>=6", "anthropic>=1.0"]

[tool.uv.sources]
razbor01 = { path = "../01-agent-vret-v-cifrah", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
razbor03 = "razbor03.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/razbor03"]

[tool.pytest.ini_options]
testpaths = ["tests"]
