# Набор eval агента-аналитика: 30 вопросов руководителя о синтетической розничной сети.
#
# Поля вопроса:
#   id            — короткий ключ, по нему сравниваются прогоны;
#   tag           — какую ловушку проверяет вопрос (список — в tags); none — контрольный вопрос без ловушки;
#   question      — текст так, как его задаёт руководитель;
#   check_sql     — живой эталон: SELECT по сырым данным с правилами компании, считается при каждой проверке;
#   trap_sql      — запрос, который попадает в ловушку; обязателен для всех тегов, кроме none,
#                   и обязан давать другое число (проверка «ловушка кусает»);
#   tolerance_pct — допуск в процентах; по умолчанию — tolerance_pct файла; 0 — точное совпадение (номер, счёт).
#
# Относительное время («последний месяц», «последние шесть месяцев») — только через данные:
# последний закрытый месяц = последний месяц со снимком остатков. Дата-литерал в эталоне
# устаревает при первой же дозагрузке.
version: 1
tolerance_pct: 0.5
tags:
  none: без ловушки
  dup_join: дубли в справочнике
  anomaly: аномальные строки
  open_month: незакрытый месяц
  definition: определение метрики
questions:
- id: Q01
  tag: none
  question: Какая выручка сети за март 2026 года, в рублях?
  check_sql: >-
    SELECT sum(amount) FROM raw.sales WHERE abs(qty) < 1000 AND sale_date BETWEEN '2026-03-01' AND '2026-03-31'
