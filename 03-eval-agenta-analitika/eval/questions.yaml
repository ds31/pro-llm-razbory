- id: Q19
  tag: open_month
  question: Какая выручка сети за последний месяц, в рублях?
  check_sql: >-
    SELECT sum(amount) FROM raw.sales WHERE abs(qty) < 1000 AND date_trunc('month', sale_date) = (SELECT max(date_trunc('month',
    snapshot_date)) FROM raw.stock)
  trap_sql: >-
    SELECT sum(amount) FROM raw.sales WHERE abs(qty) < 1000 AND date_trunc('month', sale_date) = (SELECT max(date_trunc('month',
    sale_date)) FROM raw.sales)
- id: Q20
  tag: open_month
  question: Какая среднемесячная выручка сети за последние шесть месяцев, в рублях?
  check_sql: >-
    WITH m AS (SELECT (SELECT max(date_trunc('month', snapshot_date)) FROM raw.stock) AS last) SELECT sum(amount)
    / 6 FROM raw.sales, m WHERE abs(qty) < 1000 AND date_trunc('month', sale_date) BETWEEN m.last - INTERVAL 5 MONTH
    AND m.last
  trap_sql: >-
    WITH m AS (SELECT (SELECT max(date_trunc('month', sale_date)) FROM raw.sales) AS last) SELECT sum(amount) /
    6 FROM raw.sales, m WHERE abs(qty) < 1000 AND date_trunc('month', sale_date) BETWEEN m.last - INTERVAL 5 MONTH
    AND m.last
- id: Q21
  tag: open_month
  question: >-
    На сколько процентов выручка сети за последний месяц выше или ниже, чем за предыдущий? Ответ — число процентов,
    со знаком минус при падении.
  check_sql: >-
    WITH m AS (SELECT (SELECT max(date_trunc('month', snapshot_date)) FROM raw.stock) AS last) SELECT 100.0 * (sum(amount)
    FILTER (WHERE date_trunc('month', sale_date) = m.last) / sum(amount) FILTER (WHERE date_trunc('month', sale_date)
    = m.last - INTERVAL 1 MONTH) - 1) FROM raw.sales, m WHERE abs(qty) < 1000 GROUP BY m.last
  trap_sql: >-
    WITH m AS (SELECT (SELECT max(date_trunc('month', sale_date)) FROM raw.sales) AS last) SELECT 100.0 * (sum(amount)
    FILTER (WHERE date_trunc('month', sale_date) = m.last) / sum(amount) FILTER (WHERE date_trunc('month', sale_date)
    = m.last - INTERVAL 1 MONTH) - 1) FROM raw.sales, m WHERE abs(qty) < 1000 GROUP BY m.last
