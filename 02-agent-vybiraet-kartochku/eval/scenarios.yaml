# Пять покупателей, которые пришли через AI-ассистента.
# filters — жёсткие фильтры агента в форме search_catalog / lookup_catalog Shop MCP:
#   attributes (Color, Size, Target gender), price.max (в рублях, валюта обязательна), ships_to.country,
#   available, rating.variant {min, min_count}. Страна покупателя в сценариях — код ISO (RU, BY);
#   важен не код, а то, что у карточки вообще заполнен список стран доставки.
# must_mention — то, что не влезло в фильтры: агент проверяет это по названию, описанию и характеристикам
#   («Keep hard requirements in supported filters; preserve and verify the rest» — подсказка Shop MCP агенту).
# pool — где искать товар в учётной системе. Подходящие товары («пул») определяются по catalog_erp.csv:
#   это товары, которые покупателю реально подходят. Агент видит только catalog.csv.

scenarios:
  - id: S1
    title: "Мужские непромокаемые кроссовки 42 размера до 8000 ₽, в наличии и с доставкой в страну покупателя, рейтинг от 4 при 20+ отзывах"
    tool: search_catalog
    query: "мужские непромокаемые кроссовки"
    pool: {category: Обувь, product_type: Кроссовки}
    must_mention: ["непромока", "водонепроница", "мембран"]
    filters:
      attributes:
        - {name: Target gender, values: [Мужской]}
        - {name: Size, values: ["42"]}
      price: {max: 8000, currency: RUB}
      ships_to: {country: RU}
      available: true
      rating: {variant: {min: 4.0, min_count: 20}}

  - id: S2
    title: "Чёрная женская пуховая куртка размера M до 12 000 ₽, в наличии и с доставкой в страну покупателя"
    tool: search_catalog
    query: "женская пуховая куртка чёрная"
    pool: {category: Одежда, product_type: Куртка}
    must_mention: ["пух"]
    filters:
      attributes:
        - {name: Target gender, values: [Женский]}
        - {name: Size, values: [M]}
        - {name: Color, values: [Черный]}
      price: {max: 12000, currency: RUB}
      ships_to: {country: RU}
      available: true

  - id: S3
    title: "Мужская флисовая толстовка размера L до 4000 ₽ — покупатель в другой стране (BY)"
    tool: search_catalog
    query: "мужская флисовая толстовка"
    pool: {category: Одежда, product_type: Толстовка}
    must_mention: ["флис"]
    filters:
      attributes:
        - {name: Target gender, values: [Мужской]}
        - {name: Size, values: [L]}
      price: {max: 4000, currency: RUB}
      ships_to: {country: BY}
      available: true

  - id: S4
    title: "Серое сатиновое постельное бельё, 2-спальное, до 6000 ₽, рейтинг от 4,5 при 20+ отзывах"
    tool: search_catalog
    query: "постельное бельё сатин 2-спальное серое"
    pool: {category: Дом, product_type: Постельное бельё}
    must_mention: ["сатин"]
    filters:
      attributes:
        - {name: Size, values: [2-спальный]}
        - {name: Color, values: [Серый]}
      price: {max: 6000, currency: RUB}
      ships_to: {country: RU}
      available: true
      rating: {variant: {min: 4.5, min_count: 20}}

  - id: S5
    title: "Покупатель прислал штрихкод с упаковки: «есть точно такой же, с доставкой ко мне?»"
    tool: lookup_catalog
    query: "поиск по GTIN"
    pool: {}
    lookup: gtin
    filters:
      ships_to: {country: RU}
      available: true
