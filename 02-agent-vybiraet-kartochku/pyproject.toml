[project]
name = "razbor02"
version = "0.1.0"
description = "Разбор 02: агент покупает в чате — кого он выберет. Живой Shop MCP и аудит карточек под фильтры агента"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
razbor02 = "razbor02.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/razbor02"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: ходит в живой Shop MCP; без сети пропускается"]
