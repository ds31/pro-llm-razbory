# 30 бизнес-вопросов. Данные выгружены 10.10.2026; «последний месяц» = последний закрытый (сентябрь 2026).
# check_sql — эталон по сырым таблицам с правилами компании (аномалии |qty| >= 1000 исключены, справочник без дублей).
# trap_sql — как ошибается наивный запрос; есть у всех вопросов, кроме ловушки none.
# Эталон считается живым запросом, поэтому числа не устаревают при смене генератора.
- id: Q01
  trap: none
  question: Какая выручка сети за март 2026 года, в рублях?
  check_sql: SELECT sum(amount) FROM raw.sales WHERE abs(qty) < 1000 AND sale_date BETWEEN '2026-03-01' AND '2026-03-31'
  metric_query: {metric: revenue, date_from: '2026-03-01', date_to: '2026-03-31'}
