[project]
name = "razbor01"
version = "0.1.0"
description = "Разбор 01: почему AI-агент врёт в цифрах и какая платформа данных это лечит"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.5,<2", "pyyaml>=6", "anthropic>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
razbor01 = "razbor01.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/razbor01"]

[tool.pytest.ini_options]
testpaths = ["tests"]
